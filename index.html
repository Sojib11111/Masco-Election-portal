<!doctype html>
<html lang="bn">
<head>
  <meta charset="utf-8">
<script src="assets/js/screen-fit.js?v=1.3"></script>
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>মাসকো গ্রুপ - অংশগ্রহণকারী কমিটি নির্বাচন-২০২৬</title>
  <link rel="stylesheet" href="assets/css/styles.css?v=41.0">
<link rel="stylesheet" href="assets/css/responsive.css?v=2.5">
</head>
<body class="public-body premium-dashboard bangla-ui public-v11 public-v13 public-v14 public-v15 public-v16 public-v17 public-v20">
  <header class="v20-hero" aria-label="মাসকো গ্রুপ অংশগ্রহণকারী কমিটি নির্বাচন-২০২৬">
    <div class="v20-building" aria-hidden="true"><span>MASCO GROUP</span></div>
    <div id="celebrationFloatLayer" class="v32-celebration-layer" aria-hidden="true"></div>
    <div id="fireworkLayer" class="v34-firework-layer" aria-hidden="true"></div>

    <div class="v20-brand v21-brand" aria-label="MASCO GROUP">
      <div class="v20-logo-wrap">
        <img src="assets/img/masco-logo.png" alt="MASCO Group Logo">
      </div>
    </div>

    <div class="v20-center">
      <!-- <div class="v20-org" id="org">মাসকো গ্রুপ</div><hr> -->
      <h1 id="title">অংশগ্রহণকারী কমিটি নির্বাচন-২০২৬</h1>
      <div class="v20-final-row">
        <i class="v20-line v20-line-left" aria-hidden="true"></i>
        <div class="v20-final-pill" id="statusPill"><span class="v20-check">✓</span><span>চূড়ান্ত ফলাফল</span></div>
        <i class="v20-line v20-line-right" aria-hidden="true"></i>
      </div>
      <div id="date" class="v31-election-date">নির্বাচনের তারিখ নির্ধারিত হয়নি</div>
      <div class="v31-congrats" aria-label="বিজয়ীদের অভিনন্দন"><span>🎉</span><b>বিজয়ীদের আন্তরিক অভিনন্দন</b><span>🎉</span></div>
    </div>

    <div class="v20-tools">
      <div class="v20-seal" aria-label="চূড়ান্ত ফলাফল">
        <span>সততা</span><strong>✓</strong><span>সমন্বয়</span>
      </div>
      <button type="button" id="fullscreenBtn" class="v20-fullscreen" title="পূর্ণ পর্দা"><span>⛶</span> পূর্ণ পর্দা</button>
    </div>

    <div class="v20-gold-swoosh v20-gold-swoosh-a" aria-hidden="true"></div>
    <div class="v20-gold-swoosh v20-gold-swoosh-b" aria-hidden="true"></div>
  </header>

  <main class="premium-results v11-results" id="resultViewport">
    <div class="result-dashboard premium-grid v11-grid" id="results"></div>
  </main>

  <footer class="v15-summary-footer" id="summaryFooter"></footer>
  <div class="v15-bottomline">
    <span>© ২০২৬ মাসকো গ্রুপ • অংশগ্রহণকারী কমিটি নির্বাচন ব্যবস্থাপনা</span>
    <span id="lastUpdated">সর্বশেষ হালনাগাদ</span>
  </div>

  <div id="resultSummary" hidden></div>
  <select id="publicBranchSelect" hidden></select>

  <script src="assets/js/api-config.js?v=2.0"></script>
  <script src="assets/js/store.js?v=41.3"></script>
  <script src="assets/js/result.js?v=41.3"></script>
</body>
</html>
